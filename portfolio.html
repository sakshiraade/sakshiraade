<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Sakshi Aade | Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            margin-top: 20px;
            text-align: center;
        }

        img.profile {
            border-radius: 50%;
            width: 150px;
            height: 150px;
        }

        .summary {
            margin-top: 15px;
            font-size: 18px;
            line-height: 1.6;
            max-width: 600px;
            text-align: center;
        }

        .buttons {
            margin-top: 25px;
        }

        .button {
            background-color: #007bff;
            color: white;
            padding: 15px 30px;
            margin: 10px;
            text-align: center;
            font-size: 16px;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <header>
        <img src="profilepicture.jpg" alt="Profile Picture" class="profile">
        <h1>Sakshi Aade</h1>
        <p class="summary">I'm currently pursuing my MS in Information Systems with a strong background in Data Engineering and Data Analysis. I have experience in ETL pipelines, cloud data solutions, and creating user-friendly interfaces for data exploration and analysis.</p>
    </header>

    <div class="buttons">
        <a href="#education" class="button">Education</a>
        <a href="#projects" class="button">Projects</a>
        <a href="resume.pdf" class="button" target="_blank">Resume</a>
    </div>

</body>
</html>
